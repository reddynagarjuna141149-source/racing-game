<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Racing Game - Lesson 4</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;font-family:Arial,sans-serif;touch-action:manipulation}
body{display:flex;justify-content:center;align-items:center}
#game{position:relative;width:min(100vw,480px);height:100dvh;max-height:900px;overflow:hidden;background:#287b3a;user-select:none}
#road{position:absolute;left:10%;width:80%;height:100%;top:0;background:#383d43;border-left:7px solid #f5f5f5;border-right:7px solid #f5f5f5;overflow:hidden}
.laneLine{position:absolute;top:-120px;width:6px;height:70px;background:#fff;opacity:.85;border-radius:4px}
#line1{left:33.3%}#line2{left:66.6%}
.edge{position:absolute;top:0;height:100%;width:9px;background:repeating-linear-gradient(to bottom,#e53935 0 35px,#fff 35px 70px)}
.edge.left{left:0}.edge.right{right:0}
#hud{position:absolute;top:10px;left:9px;right:9px;z-index:5;display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;color:#fff;font-weight:800;text-shadow:1px 2px 3px #000;pointer-events:none}
.pill{background:#000a;padding:7px 9px;border-radius:11px;font-size:12px}
#player{position:absolute;width:48px;height:82px;bottom:122px;left:calc(50% - 24px);z-index:3;border-radius:13px 13px 8px 8px;border:2px solid #ffd7d7;box-shadow:0 5px 8px #111}
#player:before{content:"";position:absolute;left:8px;top:13px;width:28px;height:25px;border-radius:7px 7px 3px 3px;background:linear-gradient(#c9f4ff,#487d9b);border:2px solid #222}
#player:after{content:"";position:absolute;left:6px;bottom:7px;width:32px;height:8px;background:#ffdf76;border-radius:4px;box-shadow:0 -47px 0 -1px #222}
.traffic{position:absolute;width:44px;height:72px;top:-90px;z-index:2;border-radius:10px 10px 7px 7px;border:2px solid #ffffffbf;box-shadow:0 4px 7px #111}
.traffic:before{content:"";position:absolute;left:7px;top:12px;width:26px;height:23px;background:#bde9ff;border:2px solid #222;border-radius:5px}
.coin{position:absolute;top:-45px;z-index:3;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff7a5,#ffc400 48%,#d88900 75%);border:3px solid #fff0a1;color:#7a4300;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px;box-shadow:0 0 12px #ffcf33}
#controls{position:absolute;z-index:6;bottom:22px;left:0;right:0;display:flex;justify-content:space-around;gap:20px;padding:0 25px}
.control{width:82px;height:58px;border:2px solid #fff;border-radius:17px;background:#000a;color:#fff;font-size:27px;font-weight:bold}
.control:active{transform:translateY(2px);background:#222}
#nitroBtn{position:absolute;z-index:7;bottom:91px;left:calc(50% - 48px);width:96px;height:42px;border:2px solid #fff;border-radius:14px;background:linear-gradient(#ff8a00,#e83c17);color:white;font-weight:900}
#nitroBtn.active{background:linear-gradient(#00d5ff,#0059ff);box-shadow:0 0 18px #00cfff}
#muteBtn{position:absolute;z-index:7;right:10px;bottom:97px;border:1px solid #fff;border-radius:9px;background:#111c;color:#fff;padding:8px;font-size:12px;font-weight:bold}
#overlay{position:absolute;inset:0;z-index:10;background:#000c;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:22px;overflow:auto}
#overlay h1{margin:0 0 8px;font-size:30px;color:#ffd43b}
#overlay p{max-width:320px;line-height:1.45;font-size:14px}
#startBtn{border:0;border-radius:14px;padding:13px 24px;background:#ffcf26;color:#171717;font-size:17px;font-weight:900;margin-top:12px}
#carChoices{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.carChoice{border:2px solid #fff7;border-radius:12px;background:#222;color:white;padding:9px 12px;font-weight:bold}
.carChoice.selected{border-color:#ffcf26;box-shadow:0 0 0 2px #ffcf26}
#bestScore{font-weight:bold;color:#7dffb0}
.hidden{display:none!important}
.small{font-size:12px;color:#ddd}
</style>
</head>
<body>
<div id="game">
  <div id="road"><div class="edge left"></div><div class="edge right"></div><div class="laneLine" id="line1"></div><div class="laneLine" id="line2"></div></div>
  <div id="hud">
    <div class="pill">🏁 <span id="distance">0</span> m</div>
    <div class="pill">🪙 <span id="coins">0</span></div>
    <div class="pill">⚡ <span id="speed">1</span>x</div>
    <div class="pill">🏆 Best: <span id="bestHud">0</span></div>
  </div>
  <div id="player"></div>
  <button id="muteBtn" type="button">🔊 ON</button>
  <button id="nitroBtn" type="button">🚀 NITRO</button>
  <div id="controls"><button class="control" id="leftBtn" type="button">⬅</button><button class="control" id="rightBtn" type="button">➡</button></div>
  <div id="overlay">
    <h1 id="overlayTitle">🏎️ RACING GAME</h1>
    <p id="overlayText">Lesson 4: collect coins, avoid traffic, use Nitro, unlock/select car colours and beat your best score!</p>
    <div><strong>Select your car</strong></div>
    <div id="carChoices">
      <button class="carChoice selected" data-color="#ed2638" type="button">🔴 Red</button>
      <button class="carChoice" data-color="#168cff" type="button">🔵 Blue</button>
      <button class="carChoice" data-color="#20b66b" type="button">🟢 Green</button>
      <button class="carChoice" data-color="#a34be8" type="button">🟣 Purple</button>
    </div>
    <p class="small">Best score: <span id="bestScore">0</span> m<br>Controls: touch buttons or keyboard ← → / A D</p>
    <button id="startBtn" type="button">START RACE</button>
  </div>
</div>
<script>
(() => {
  const game=document.getElementById('game'), road=document.getElementById('road'), player=document.getElementById('player');
  const overlay=document.getElementById('overlay'), overlayTitle=document.getElementById('overlayTitle'), overlayText=document.getElementById('overlayText');
  const startBtn=document.getElementById('startBtn'), distanceEl=document.getElementById('distance'), coinsEl=document.getElementById('coins'), speedEl=document.getElementById('speed');
  const bestHud=document.getElementById('bestHud'), bestScoreEl=document.getElementById('bestScore'), nitroBtn=document.getElementById('nitroBtn'), muteBtn=document.getElementById('muteBtn');
  const lines=[...document.querySelectorAll('.laneLine')], carChoices=[...document.querySelectorAll('.carChoice')];
  let running=false,lane=1,distance=0,coinCount=0,speedLevel=1,traffic=[],coins=[],lineOffset=0,spawnTimer=0,coinTimer=0,lastTime=0,soundOn=true,audioCtx=null,nitroUntil=0,selectedColor='#ed2638',best=0;
  try{best=Number(localStorage.getItem('racingLesson4Best')||0)}catch(e){best=0}
  bestHud.textContent=best;bestScoreEl.textContent=best;
  const laneCenters=[.22,.5,.78];
  function setCarColor(color){selectedColor=color;player.style.background=`linear-gradient(90deg,${color},${color}bb 45%,${color})`;carChoices.forEach(b=>b.classList.toggle('selected',b.dataset.color===color))}
  carChoices.forEach(b=>b.addEventListener('click',()=>{setCarColor(b.dataset.color);beep(500,.07)}));
  function initAudio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
  function beep(freq=600,duration=.12,type='sine',volume=.06){if(!soundOn)return;initAudio();if(!audioCtx)return;try{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type=type;osc.frequency.value=freq;gain.gain.value=volume;osc.connect(gain);gain.connect(audioCtx.destination);osc.start();gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);osc.stop(audioCtx.currentTime+duration)}catch(e){}}
  function updatePlayerPosition(){const rr=road.getBoundingClientRect(),gr=game.getBoundingClientRect();player.style.left=(rr.left-gr.left+rr.width*laneCenters[lane]-player.offsetWidth/2)+'px'}
  function makeTraffic(){const el=document.createElement('div');el.className='traffic';const colors=['#2878d0','#f4a623','#7b4bb7','#20a17a','#eeeeee'];const l=Math.floor(Math.random()*3);el.style.background=colors[Math.floor(Math.random()*colors.length)];el.style.left=(road.offsetLeft+road.clientWidth*laneCenters[l]-22)+'px';el.style.top='-90px';game.appendChild(el);traffic.push({el,lane:l,y:-90})}
  function makeCoin(){const el=document.createElement('div');el.className='coin';el.textContent='★';const l=Math.floor(Math.random()*3);el.style.left=(road.offsetLeft+road.clientWidth*laneCenters[l]-15)+'px';el.style.top='-45px';game.appendChild(el);coins.push({el,lane:l,y:-45})}
  function overlaps(a,b){const A=a.getBoundingClientRect(),B=b.getBoundingClientRect();return A.left<B.right-5&&A.right>B.left+5&&A.top<B.bottom-5&&A.bottom>B.top+5}
  function clearObjects(){traffic.forEach(o=>o.el.remove());coins.forEach(o=>o.el.remove());traffic=[];coins=[]}
  function startGame(){initAudio();clearObjects();running=true;lane=1;distance=0;coinCount=0;speedLevel=1;lineOffset=0;spawnTimer=0;coinTimer=0;nitroUntil=0;lastTime=performance.now();distanceEl.textContent='0';coinsEl.textContent='0';speedEl.textContent='1';updatePlayerPosition();nitroBtn.classList.remove('active');overlay.classList.add('hidden');beep(700,.1,'triangle');requestAnimationFrame(loop)}
  function gameOver(){if(!running)return;running=false;beep(130,.4,'sawtooth',.08);const finalDistance=Math.floor(distance);if(finalDistance>best){best=finalDistance;try{localStorage.setItem('racingLesson4Best',String(best))}catch(e){}bestHud.textContent=best;bestScoreEl.textContent=best}overlayTitle.textContent='💥 GAME OVER';overlayText.innerHTML=`Distance: <b>${finalDistance} m</b><br>Coins collected: <b>${coinCount}</b><br>🏆 Best score: <b>${best} m</b>`;startBtn.textContent='RESTART';overlay.classList.remove('hidden')}
  function loop(now){if(!running)return;const dt=Math.min((now-lastTime)/16.67,2.5);lastTime=now;const nitro=now<nitroUntil;const baseSpeed=3.4+speedLevel*.62;const gameSpeed=baseSpeed*(nitro?2.0:1);distance+=dt*(.7+speedLevel*.12)*(nitro?1.8:1);speedLevel=Math.min(10,1+Math.floor(distance/120));distanceEl.textContent=Math.floor(distance);speedEl.textContent=speedLevel+(nitro?'🚀':'');nitroBtn.classList.toggle('active',nitro);
    lineOffset=(lineOffset+gameSpeed*dt)%150;lines.forEach((line,i)=>line.style.top=(lineOffset-100+i*75)+'px');
    spawnTimer+=dt;if(spawnTimer>Math.max(27,78-speedLevel*4)){makeTraffic();spawnTimer=0}coinTimer+=dt;if(coinTimer>95){makeCoin();coinTimer=0}
    for(let i=traffic.length-1;i>=0;i--){const o=traffic[i];o.y+=gameSpeed*dt;o.el.style.top=o.y+'px';if(overlaps(player,o.el)){gameOver();return}if(o.y>game.clientHeight+30){o.el.remove();traffic.splice(i,1)}}
    for(let i=coins.length-1;i>=0;i--){const o=coins[i];o.y+=gameSpeed*dt;o.el.style.top=o.y+'px';if(overlaps(player,o.el)){coinCount++;coinsEl.textContent=coinCount;beep(950,.1,'sine',.05);o.el.remove();coins.splice(i,1);continue}if(o.y>game.clientHeight+30){o.el.remove();coins.splice(i,1)}}
    requestAnimationFrame(loop)}
  function move(dir){if(!running)return;const next=Math.max(0,Math.min(2,lane+dir));if(next!==lane){lane=next;updatePlayerPosition();beep(320,.06,'square',.025)}}
  function useNitro(){if(!running)return;const now=performance.now();if(now<nitroUntil)return;nitroUntil=now+2200;beep(240,.2,'sawtooth',.05)}
  document.getElementById('leftBtn').addEventListener('pointerdown',e=>{e.preventDefault();move(-1)});
  document.getElementById('rightBtn').addEventListener('pointerdown',e=>{e.preventDefault();move(1)});
  nitroBtn.addEventListener('pointerdown',e=>{e.preventDefault();useNitro()});
  window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a'){e.preventDefault();move(-1)}if(e.key==='ArrowRight'||e.key.toLowerCase()==='d'){e.preventDefault();move(1)}if((e.key===' '||e.key.toLowerCase()==='n')&&running){e.preventDefault();useNitro()}if((e.key==='Enter'||e.key===' ')&&!running)startGame()});
  startBtn.addEventListener('click',startGame);
  muteBtn.addEventListener('click',()=>{soundOn=!soundOn;muteBtn.textContent=soundOn?'🔊 ON':'🔇 OFF';if(soundOn)beep(700,.1)});
  window.addEventListener('resize',updatePlayerPosition);setCarColor(selectedColor);updatePlayerPosition();
})();
</script>
</body>
</html>
