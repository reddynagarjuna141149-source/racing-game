<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Turbo Road Racing - Updated</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;font-family:Arial,sans-serif;touch-action:manipulation}body{display:flex;justify-content:center;align-items:center}button{cursor:pointer}
#game{position:relative;width:min(100vw,480px);height:100dvh;max-height:900px;overflow:hidden;background:linear-gradient(#287b3a,#174e2a);user-select:none}
#road{position:absolute;left:10%;width:80%;height:100%;top:0;background:repeating-linear-gradient(to bottom,#41474e 0 80px,#343940 80px 160px);border-left:7px solid #fff;border-right:7px solid #fff;overflow:hidden;box-shadow:0 0 35px #0008;perspective:500px}
.laneLine{position:absolute;top:-120px;width:6px;height:70px;background:#fff;opacity:.85;border-radius:4px}#line1{left:33.3%}#line2{left:66.6%}
.edge{position:absolute;top:0;height:100%;width:9px;background:repeating-linear-gradient(to bottom,#e53935 0 35px,#fff 35px 70px)}.edge.left{left:0}.edge.right{right:0}
#hud{position:absolute;top:8px;left:7px;right:7px;z-index:5;display:flex;flex-wrap:wrap;gap:5px;justify-content:space-between;color:#fff;font-weight:800;text-shadow:1px 2px 3px #000;pointer-events:none}.pill{background:#000b;padding:6px 8px;border-radius:10px;font-size:11px}
#player{position:absolute;width:44px;height:76px;bottom:118px;left:calc(50% - 22px);z-index:3;border-radius:12px 12px 7px 7px;border:2px solid #ffd7d7;box-shadow:0 8px 12px #0009,inset 0 -8px 0 #0003;transform:perspective(400px) rotateX(-3deg)}
#player:before{content:"";position:absolute;left:7px;top:12px;width:26px;height:23px;border-radius:6px;background:linear-gradient(#d6f8ff,#487d9b);border:2px solid #222}
#player:after{content:"";position:absolute;bottom:5px;left:5px;width:30px;height:8px;border-radius:3px;background:#ff4545;box-shadow:0 0 8px #ff2525}
.traffic,.police{position:absolute;width:42px;height:68px;top:-90px;z-index:2;border-radius:10px;border:2px solid #ffffffbf;box-shadow:0 8px 12px #0009;transition:transform .08s linear}
.traffic:before,.police:before{content:"";position:absolute;left:6px;top:11px;width:26px;height:22px;background:linear-gradient(#d6f8ff,#487d9b);border:2px solid #222;border-radius:5px}
.traffic:after,.police:after{content:"";position:absolute;bottom:5px;left:5px;width:28px;height:6px;background:#ff4545;border-radius:3px}
.police{display:none!important;background:linear-gradient(90deg,#f4f4f4 0 35%,#1951a4 35% 75%,#f4f4f4 75%)}
.police:before{background:linear-gradient(90deg,#d7f4ff,#77bde0)}

.coin{
  position:absolute;
  width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  border:3px solid #fff5a3;
  background:radial-gradient(circle at 30% 25%,#fffbd0 0 10%,#ffe94a 22%,#ffb700 62%,#e87800 100%);
  color:#8a4200;font-size:25px;font-weight:900;line-height:1;
  text-shadow:0 1px 2px #fff5a3;
  box-shadow:0 0 18px 5px #ffd700bb,inset 0 0 5px #fff;
  z-index:8;pointer-events:none;
  animation:coinSpin .7s infinite alternate ease-in-out;
}
@keyframes coinSpin{
  from{transform:scaleX(.78) rotate(-8deg);filter:brightness(1)}
  to{transform:scaleX(1) rotate(8deg);filter:brightness(1.25)}
}
@keyframes coinSpin{
  from{transform:scaleX(.72) rotate(-8deg);filter:brightness(1)}
  to{transform:scaleX(1) rotate(8deg);filter:brightness(1.25)}
}

#weather,#nightShade{position:absolute;inset:0;z-index:4;pointer-events:none;display:none}#weather{background:repeating-linear-gradient(105deg,transparent 0 18px,#b8e7ff8c 19px 21px,transparent 22px 38px)}#nightShade{background:#06132d9c}
#controls{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:space-around;padding:0 24px;z-index:6}.control{width:78px;height:56px;border:2px solid #fff;border-radius:16px;background:#000b;color:#fff;font-size:27px;font-weight:bold}
#nitroBtn{position:absolute;bottom:82px;left:calc(50% - 47px);width:94px;height:39px;border:2px solid #fff;border-radius:13px;background:linear-gradient(#ff8a00,#e83c17);color:white;font-weight:900;z-index:6}
#nitroBtn.active{animation:nitroGlow .25s infinite alternate}@keyframes nitroGlow{from{box-shadow:0 0 5px #ff9800}to{box-shadow:0 0 24px #ff2d00}}
#muteBtn,#shopBtn{position:absolute;bottom:88px;z-index:6;border:1px solid #fff;border-radius:9px;background:#111d;color:#fff;padding:7px;font-size:11px;font-weight:bold}#muteBtn{right:7px}#shopBtn{left:7px}
#overlay{position:absolute;inset:0;z-index:10;background:#000d;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:18px;overflow:auto}#overlay h1{margin:0 0 7px;font-size:28px;color:#ffd43b}#overlay p{max-width:330px;line-height:1.4;font-size:13px}
#startBtn,.mainBtn{border:0;border-radius:12px;padding:12px 20px;background:#ffcf26;color:#171717;font-size:16px;font-weight:900;margin-top:8px}
#carChoices,#modes{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:7px 0}.carChoice,.modeBtn{border:2px solid #fff7;border-radius:10px;background:#222;color:white;padding:8px 10px;font-weight:bold;font-size:12px}.selected{border-color:#ffcf26!important;box-shadow:0 0 0 1px #ffcf26}.small{font-size:11px;color:#ddd}#bestScore{font-weight:bold;color:#7dffb0}
#shopPanel{position:absolute;inset:5% 4%;z-index:12;background:#101820f5;color:white;border:2px solid #ffd43b;border-radius:16px;padding:14px;display:none;overflow:auto;text-align:center}#shopPanel h2{margin:4px;color:#ffd43b}#shopItems{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.shopItem{border:1px solid #ffffff55;background:#26323b;border-radius:10px;padding:10px;font-size:12px}.shopItem button{margin-top:7px;border:0;border-radius:8px;padding:7px;background:#ffd43b;font-weight:bold}#closeShop{background:#ddd;border:0;border-radius:8px;padding:8px 14px;font-weight:bold}
#message{position:absolute;top:90px;left:50%;transform:translateX(-50%);z-index:13;color:#fff;background:#000b;border-radius:10px;padding:8px 12px;font-size:12px;display:none;text-align:center;max-width:90%}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="game">
  <div id="road"><div class="edge left"></div><div class="edge right"></div><div class="laneLine" id="line1"></div><div class="laneLine" id="line2"></div></div>
  <div id="hud"><div class="pill">🏁 <span id="distance">0</span> m</div><div class="pill">🪙 <span id="coins">0</span></div><div class="pill">⚡ <span id="speed">1</span>x</div><div class="pill">🏆 <span id="bestHud">0</span></div><div class="pill">🎮 <span id="modeHud">Easy</span></div></div>
  <div id="player"></div><div id="weather"></div><div id="nightShade"></div>
  <button id="shopBtn" type="button">🛒 SHOP</button><button id="muteBtn" type="button">🔊 ON</button><button id="nitroBtn" type="button">🚀 NITRO</button>
  <div id="controls"><button class="control" id="leftBtn" type="button">⬅</button><button class="control" id="rightBtn" type="button">➡</button></div><div id="message"></div>
  <div id="shopPanel"><h2>🛒 COIN SHOP</h2><p>Coins: <b id="shopCoins">0</b> 🪙</p><div id="shopItems"></div><button id="closeShop" type="button">CLOSE</button></div>
  <div id="overlay"><h1 id="overlayTitle">🏎️ TURBO ROAD</h1><p id="overlayText">Collect coins, dodge traffic and escape the police! Buy cars and nitro upgrades in the shop.</p>
    <div><strong>Choose difficulty</strong></div><div id="modes"><button class="modeBtn selected" data-mode="Easy" type="button">🟢 Easy</button><button class="modeBtn" data-mode="Medium" type="button">🟠 Medium</button><button class="modeBtn" data-mode="Hard" type="button">🔴 Hard</button></div>
    <div style="margin-top:8px"><strong>Select unlocked car</strong></div><div id="carChoices"></div><p class="small">Best: <span id="bestScore">0</span> m<br>Touch arrows to steer. Tap NITRO for boost.</p>
    <button id="overlayShopBtn" class="mainBtn" type="button">🛒 OPEN SHOP</button><button id="startBtn" type="button">🏁 START RACE</button>
  </div>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const game=$('game'),road=$('road'),player=$('player'),overlay=$('overlay'),nitroBtn=$('nitroBtn');
const distanceEl=$('distance'),coinsEl=$('coins'),speedEl=$('speed'),bestHud=$('bestHud'),bestScoreEl=$('bestScore');
const laneCenters=[.22,.5,.78];
const cars=[{id:'red',name:'Red Racer',color:'#ed2638',price:0,boost:1},{id:'blue',name:'Blue Bolt',color:'#168cff',price:30,boost:1.05},{id:'green',name:'Green Flash',color:'#20b66b',price:50,boost:1.1},{id:'purple',name:'Purple Storm',color:'#a34be8',price:80,boost:1.15},{id:'gold',name:'Golden Beast',color:'#ffb900',price:120,boost:1.25},{id:'black',name:'Shadow GT',color:'#292d35',price:160,boost:1.3}];
let running=false,lane=1,distance=0,runCoins=0,traffic=[],coins=[],lines=[...document.querySelectorAll('.laneLine')],lineOffset=0,spawnTimer=0,coinTimer=0,policeTimer=0,lastTime=0,soundOn=true,audioCtx=null,nitroUntil=0,selectedCar='red',mode='Easy',messageTimer=0;
let bank=0,best=0,nitroLevel=0,unlocked=['red'];
try{bank=Number(localStorage.getItem('turboBank')||0);best=Number(localStorage.getItem('turboBest')||0);nitroLevel=Number(localStorage.getItem('turboNitro')||0);unlocked=JSON.parse(localStorage.getItem('turboUnlocked')||'["red"]')}catch(e){}
if(!Array.isArray(unlocked)||!unlocked.includes('red'))unlocked=['red'];
const modes={Easy:{mult:.82,spawn:78,police:1100},Medium:{mult:1,spawn:65,police:800},Hard:{mult:1.28,spawn:52,police:560}};
function save(){try{localStorage.setItem('turboBank',String(bank));localStorage.setItem('turboBest',String(best));localStorage.setItem('turboNitro',String(nitroLevel));localStorage.setItem('turboUnlocked',JSON.stringify(unlocked))}catch(e){}}
function initAudio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function beep(freq=600,duration=.12,type='sine',volume=.05){if(!soundOn)return;initAudio();if(!audioCtx)return;try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=volume;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.stop(audioCtx.currentTime+duration)}catch(e){}}
function say(msg){const m=$('message');m.textContent=msg;m.style.display='block';clearTimeout(messageTimer);messageTimer=setTimeout(()=>m.style.display='none',1800)}
function setCarColor(){const c=cars.find(x=>x.id===selectedCar)||cars[0];player.style.background=`linear-gradient(90deg,${c.color},${c.color}bb 45%,${c.color})`;renderCars()}
function renderCars(){const box=$('carChoices');box.innerHTML='';cars.filter(c=>unlocked.includes(c.id)).forEach(c=>{const b=document.createElement('button');b.className='carChoice'+(c.id===selectedCar?' selected':'');b.textContent=c.name;b.style.borderBottom='4px solid '+c.color;b.onclick=()=>{selectedCar=c.id;setCarColor();beep(500,.06)};box.appendChild(b)})}
function renderShop(){$('shopCoins').textContent=bank;const box=$('shopItems');box.innerHTML='';cars.forEach(c=>{const owned=unlocked.includes(c.id),item=document.createElement('div');item.className='shopItem';item.innerHTML=`<div style="font-size:23px">🚗</div><b>${c.name}</b><div style="color:${c.color}">Car upgrade</div><div>${c.price===0?'FREE':c.price+' coins'}</div>`;const b=document.createElement('button');b.textContent=owned?(selectedCar===c.id?'SELECTED':'SELECT'):c.price+' 🪙 BUY';b.onclick=()=>{if(!owned){if(bank<c.price){say('Not enough coins!');return}bank-=c.price;unlocked.push(c.id);save();say(c.name+' unlocked!')}selectedCar=c.id;setCarColor();renderShop()};item.appendChild(b);box.appendChild(item)});const item=document.createElement('div');item.className='shopItem';item.innerHTML=`<div style="font-size:23px">🚀</div><b>Nitro Upgrade Lv.${nitroLevel}/5</b><div>Longer boost</div><div>${nitroLevel>=5?'MAX':(50+nitroLevel*35)+' coins'}</div>`;const b=document.createElement('button');b.textContent=nitroLevel>=5?'MAX LEVEL':'UPGRADE';b.disabled=nitroLevel>=5;b.onclick=()=>{const cost=50+nitroLevel*35;if(bank<cost){say('Not enough coins!');return}bank-=cost;nitroLevel++;save();renderShop();say('Nitro upgraded!')};item.appendChild(b);box.appendChild(item);$('shopCoins').textContent=bank}
function updatePlayerPosition(){const rr=road.getBoundingClientRect(),gr=game.getBoundingClientRect();player.style.left=(rr.left-gr.left+rr.width*laneCenters[lane]-player.offsetWidth/2)+'px'}
function spawnTraffic(isPolice=false){const el=document.createElement('div');el.className=isPolice?'police':'traffic';if(!isPolice){const colors=['#2878d0','#f4a623','#7b4bb7','#20a17a','#eee'];el.style.background=colors[Math.floor(Math.random()*colors.length)]}const l=Math.floor(Math.random()*3);el.style.left=(road.offsetLeft+road.clientWidth*laneCenters[l]-21)+'px';el.style.top='-90px';game.appendChild(el);traffic.push({el,lane:l,y:-90,police:isPolice})}
function makeCoin(){
  const el = document.createElement('div');
  el.className = 'coin';
  el.textContent = '★';
  const laneIndex = Math.floor(Math.random() * 3);
  const roadRect = road.getBoundingClientRect();
  const gameRect = game.getBoundingClientRect();
  const coinSize = 36;
  const x = roadRect.left - gameRect.left
          + roadRect.width * laneCenters[laneIndex]
          - coinSize / 2;
  el.style.left = Math.max(2, Math.min(game.clientWidth - coinSize - 2, x)) + 'px';
  el.style.top = '-42px';
  game.appendChild(el);
  coins.push({ el: el, lane: laneIndex, y: -42 });
}
function overlaps(a,b){const A=a.getBoundingClientRect(),B=b.getBoundingClientRect();return A.left<B.right-4&&A.right>B.left+4&&A.top<B.bottom-4&&A.bottom>B.top+4}
function clearObjects(){traffic.forEach(o=>o.el.remove());coins.forEach(o=>o.el.remove());traffic=[];coins=[]}
function setWeather(){const choice=Math.random();if(choice<.34){$('weather').style.display='block';$('nightShade').style.display='none';say('Rain mode!')}else if(choice<.58){$('weather').style.display='none';$('nightShade').style.display='block';say('Night mode!')}else{$('weather').style.display='none';$('nightShade').style.display='none'}}
function startGame(){
  try {
    initAudio(); clearObjects();
    running=true; lane=1; distance=0; runCoins=0; lineOffset=0;
    spawnTimer=0; coinTimer=0; policeTimer=0; nitroUntil=0;
    lastTime=performance.now();
    distanceEl.textContent='0'; coinsEl.textContent='0'; speedEl.textContent='1';
    $('modeHud').textContent=mode;
    setWeather(); updatePlayerPosition(); nitroBtn.classList.remove('active');
    $('shopPanel').style.display='none'; overlay.classList.add('hidden');
    $('startBtn').textContent='🏁 RACE AGAIN';
    beep(700,.1,'triangle');
    requestAnimationFrame(loop);
  } catch(err) {
    running=false; overlay.classList.remove('hidden');
    $('overlayTitle').textContent='Game start error';
    $('overlayText').textContent='Please refresh the page and try again. Error: '+err.message;
    console.error('Game start error:',err);
  }
}
function gameOver(){if(!running)return;running=false;beep(130,.4,'sawtooth',.08);const finalDistance=Math.floor(distance);bank+=runCoins;if(finalDistance>best)best=finalDistance;save();bestHud.textContent=best;bestScoreEl.textContent=best;$('overlayTitle').textContent='💥 GAME OVER';$('overlayText').innerHTML=`Distance: <b>${finalDistance} m</b><br>Coins this race: <b>${runCoins}</b><br>Coins in bank: <b>${bank}</b><br>Best score: <b>${best} m</b>`;$('startBtn').textContent='🏁 RACE AGAIN';overlay.classList.remove('hidden')}
function loop(now){if(!running)return;const dt=Math.min((now-lastTime)/16.67,2.5);lastTime=now;const nitro=now<nitroUntil,config=modes[mode],car=cars.find(c=>c.id===selectedCar)||cars[0],base=(3.1+Math.min(7,distance/180))*config.mult*car.boost,gameSpeed=base*(nitro?2.05:1);distance+=dt*(.62+base*.13)*(nitro?1.65:1);const speedLevel=Math.min(10,1+Math.floor(distance/120));distanceEl.textContent=Math.floor(distance);speedEl.textContent=speedLevel+(nitro?'🚀':'');nitroBtn.classList.toggle('active',nitro);lineOffset=(lineOffset+gameSpeed*dt)%150;lines.forEach((line,i)=>line.style.top=(lineOffset-100+i*75)+'px');spawnTimer+=dt;if(spawnTimer>Math.max(24,config.spawn-speedLevel*2.2)){spawnTraffic(false);spawnTimer=0}coinTimer+=dt;if(coinTimer>32){makeCoin();coinTimer=0}policeTimer+=dt;
for(let i=traffic.length-1;i>=0;i--){const o=traffic[i];
// Police actively chase the player's current lane and move faster as distance increases.
if(o.police){o.chaseTick=(o.chaseTick||0)+dt;if(o.chaseTick>16){o.chaseTick=0;if(o.lane<lane)o.lane++;else if(o.lane>lane)o.lane--;const rr=road.getBoundingClientRect(),gr=game.getBoundingClientRect();o.el.style.left=(rr.left-gr.left+rr.width*laneCenters[o.lane]-o.el.offsetWidth/2)+'px';}o.y+=gameSpeed*dt*(1.08+Math.min(.45,distance/1800));o.el.style.filter='drop-shadow(0 0 7px #ff2222)';}else{o.y+=gameSpeed*dt;}
o.el.style.top=o.y+'px';o.el.style.transform=`scale(${Math.max(.72,Math.min(1.18,.78+o.y/game.clientHeight*.42))})`;if(overlaps(player,o.el)){if(o.police)say('🚨 Police caught you!');gameOver();return}if(o.y>game.clientHeight+30){o.el.remove();traffic.splice(i,1)}}
for(let i=coins.length-1;i>=0;i--){const o=coins[i];o.y+=gameSpeed*dt;o.el.style.top=o.y+'px';if(overlaps(player,o.el)){runCoins++;coinsEl.textContent=runCoins;o.el.remove();coins.splice(i,1);continue}if(o.y>game.clientHeight+30){o.el.remove();coins.splice(i,1)}}requestAnimationFrame(loop)}
function move(dir){if(!running)return;lane=Math.max(0,Math.min(2,lane+dir));updatePlayerPosition()}
function useNitro(){if(!running)return;const now=performance.now();if(now<nitroUntil)return;nitroUntil=now+(2200+nitroLevel*600)}
$('leftBtn').addEventListener('pointerdown',e=>{e.preventDefault();move(-1)});$('rightBtn').addEventListener('pointerdown',e=>{e.preventDefault();move(1)});nitroBtn.addEventListener('pointerdown',e=>{e.preventDefault();useNitro()});
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')move(-1);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')move(1);if((e.key===' '||e.key.toLowerCase()==='n')&&running)useNitro();if((e.key==='Enter'||e.key===' ')&&!running&&$('shopPanel').style.display!=='block')startGame()});
$('startBtn').addEventListener('click',function(e){e.preventDefault();e.stopPropagation();startGame();});
$('startBtn').addEventListener('pointerup',function(e){e.preventDefault();if(!running)startGame();});$('overlayShopBtn').addEventListener('click',()=>{renderShop();$('shopPanel').style.display='block'});$('muteBtn').addEventListener('click',()=>{soundOn=!soundOn;$('muteBtn').textContent=soundOn?'🔊 ON':'🔇 OFF'});$('shopBtn').addEventListener('click',()=>{renderShop();$('shopPanel').style.display='block'});$('closeShop').addEventListener('click',()=>$('shopPanel').style.display='none');
document.querySelectorAll('.modeBtn').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('.modeBtn').forEach(x=>x.classList.toggle('selected',x===b))}));
setCarColor();renderCars();bestHud.textContent=best;bestScoreEl.textContent=best;updatePlayerPosition();window.addEventListener('resize',updatePlayerPosition);
})();
</script>
</body>
</html>
